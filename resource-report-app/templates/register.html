{% extends "base.html" %}

{% block content %}
<div class="page-container" style="max-width: 480px; margin-top: 60px;">
    <div class="card">
        <div class="card-header" style="justify-content: center; padding: 24px;">
            <h2 class="dash-title" style="margin: 0; font-size: 24px;">Register Account</h2>
        </div>
        <div class="card-body" style="padding: 32px;">
            {% if error %}
            <div class="attention-card attention-danger" style="margin-bottom: 24px;">
                {{ error }}
            </div>
            {% endif %}

            <form action="/register" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role" class="form-control">
                        <option value="TL">Team Lead</option>
                        <option value="PM">Project Manager</option>
                    </select>
                </div>
                <div class="form-submit-row">
                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Register Account</button>
                </div>
            </form>
            
            <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--slate-600);">
                Already have an account? 
                <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Log in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
