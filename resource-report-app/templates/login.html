{% extends "base.html" %}

{% block content %}
<div class="page-container" style="max-width: 480px; margin-top: 60px;">
    <div class="card">
        <div class="card-header" style="justify-content: center; padding: 24px;">
            <h2 class="dash-title" style="margin: 0; font-size: 24px;">Login</h2>
        </div>
        <div class="card-body" style="padding: 32px;">
            {% if error %}
            <div class="attention-card attention-danger" style="margin-bottom: 24px;">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="form-submit-row">
                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Log In</button>
                </div>
            </form>
            
            <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--slate-600);">
                Don't have an account? 
                <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register as Team Lead</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
